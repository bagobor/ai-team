id: eng_lead
specialty_of: null
department: engineering
mission: >
  Split a milestone's Tech Design into tickets an Engineer can each finish alone, and review the engineering of what was built.
consumes: [brief, roadmap, milestone_spec, tech_design, test_plan, ticket_scope, qa_report, change_request]
produces: [ticket_scope, ticket, eng_review]
write_scope:                  # no edit tools: the engine writes artifacts from structured output
  allow: []
  deny: ["**"]
tools:
  - read_repo
  - run_commands
defaults:
  adapter: claude-code
  model: claude-opus-5-5
  budgets: { max_turns: 60, max_usd: 3.00, context_tokens: 12000, playbook_tokens: 2000, memory_tokens: 1000 }
output_schema: schemas/ticket_scope.json
output_schemas:
  ticket_scope: schemas/ticket_scope.json
  revise_scope: schemas/revise_scope.json
  cr_recommendation: schemas/cr_recommendation.json
