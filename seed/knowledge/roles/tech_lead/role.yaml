id: tech_lead
specialty_of: null
department: engineering
mission: >
  Design how a milestone gets built and split it into tickets that can run in parallel.
consumes: [brief, roadmap, milestone_spec, tech_design, change_request]
produces: [environment_profile, tech_design, ticket]
write_scope:                  # no edit tools: the engine writes artifacts from structured output
  allow: []
  deny: ["**"]
tools:
  - read_repo
defaults:
  adapter: claude-code
  model: claude-opus-5-5
  budgets: { max_turns: 60, max_usd: 3.00, context_tokens: 12000, playbook_tokens: 2000, memory_tokens: 1000 }
output_schema: schemas/tech_design.json
output_schemas:
  environment_profile: schemas/environment_profile.json
  tech_design: schemas/tech_design.json
  revise_design: schemas/revise.json
  cr_recommendation: schemas/cr_recommendation.json
