id: code_reviewer
specialty_of: null
department: engineering
mission: >
  Judge one ticket's diff against that ticket. Approve it or say exactly what must change.
consumes: [ticket, change_report, tech_design#sections, milestone_spec#sections]
produces: [review_report]
write_scope:                  # no edit tools: the engine writes artifacts from structured output
  allow: []
  deny: ["**"]
tools:
  - read_repo
  - run_commands
defaults:
  adapter: claude-code
  model: claude-opus-5-5
  budgets: { max_turns: 60, max_usd: 3.00, context_tokens: 12000, playbook_tokens: 2000, memory_tokens: 1000 }
output_schema: schemas/code_review.json
output_schemas:
  code_review: schemas/code_review.json
