<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touch-ok</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<script type="module">
  // A game played by touch: a tap changes the color of the block.
  const g = document.getElementById('screen').getContext('2d');
  let x = 0;
  let color = '#fd0';
  addEventListener('pointerdown', () => {
    color = color === '#fd0' ? '#4cf' : '#fd0';
  });
  function frame() {
    x = (x + 3) % 320;
    g.fillStyle = '#000';
    g.fillRect(0, 0, 320, 180);
    g.fillStyle = color;
    g.fillRect(x, 70, 40, 40);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
