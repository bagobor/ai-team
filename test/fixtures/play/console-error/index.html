<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>console-error</title>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<script>
  // A healthy animation, so the defect this page carries is the only thing the smoke check can find.
  const g = document.getElementById('screen').getContext('2d');
  let t = 0;
  function frame() {
    t += 1;
    g.fillStyle = '#000';
    g.fillRect(0, 0, 320, 180);
    g.fillStyle = '#fc0';
    g.fillRect(t % 300, 80, 20, 20);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
<script>
  console.error('bad');
</script>
</body>
</html>
