<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>alert</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<script type="module">
  // A game that greets the player with an alert blocks its own load until someone answers it.
  alert('start');

  const g = document.getElementById('screen').getContext('2d');
  let x = 0;
  function frame() {
    x = (x + 3) % 320;
    g.fillStyle = '#000';
    g.fillRect(0, 0, 320, 180);
    g.fillStyle = '#fd0';
    g.fillRect(x, 70, 40, 40);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
