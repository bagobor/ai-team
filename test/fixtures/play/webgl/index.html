<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>webgl</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; margin: 40px auto; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="240"></canvas>
<script>
  const gl = document.getElementById('screen').getContext('webgl');
  // Without a context the test should say so, rather than fail later as a blank page.
  if (!gl) throw new Error('WebGL is unavailable');
  let t = 0;
  function frame() {
    t += 1;
    // Full saturation around the hue circle never comes back to the black of the page behind it.
    const hue = (t * 4) % 360;
    const [r, g, b] = [0, 120, 240].map((shift) => 0.5 + 0.5 * Math.cos(((hue - shift) * Math.PI) / 180));
    gl.clearColor(r, g, b, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
