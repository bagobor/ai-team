<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touch-unseen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 24px sans-serif; }
  h1 { margin: 0; padding: 40px; background: #234; color: #fc6; }
</style>
</head>
<body>
<!-- A page with no animation loop that hears a tap and shows nothing for it. -->
<h1>Board</h1>
<script type="module">
  let taps = 0;
  addEventListener('pointerdown', () => {
    taps += 1;
  });
</script>
</body>
</html>
