<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>frozen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="360"></canvas>
<script>
  // The first frame is drawn, but no loop is ever started, as when a game's update throws or is never scheduled.
  const g = document.getElementById('screen').getContext('2d');
  g.fillStyle = '#123';
  g.fillRect(0, 0, 640, 360);
  g.fillStyle = '#4cf';
  g.fillRect(100, 160, 40, 40);
</script>
</body>
</html>
