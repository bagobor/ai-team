<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ok</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="360"></canvas>
<script type="module">
  const canvas = document.getElementById('screen');
  const g = canvas.getContext('2d');
  const stars = Array.from({ length: 60 }, (_, i) => ({ x: (i * 97) % 640, y: (i * 53) % 360, speed: 1 + (i % 3) }));
  const held = new Set();
  // The play script reads the ship's position, so the game exposes it.
  window.ship = { x: 100, y: 180, shots: 0 };

  addEventListener('keydown', (e) => {
    held.add(e.code);
    if (e.code === 'Space') window.ship.shots += 1;
  });
  addEventListener('keyup', (e) => held.delete(e.code));

  function frame() {
    const ship = window.ship;
    if (held.has('ArrowLeft')) ship.x -= 4;
    if (held.has('ArrowRight')) ship.x += 4;
    if (held.has('ArrowUp')) ship.y -= 4;
    if (held.has('ArrowDown')) ship.y += 4;

    g.fillStyle = '#000';
    g.fillRect(0, 0, 640, 360);
    g.fillStyle = '#fff';
    for (const star of stars) {
      star.x = (star.x - star.speed + 640) % 640;
      g.fillRect(star.x, star.y, 3, 3);
    }
    g.fillStyle = '#4cf';
    g.beginPath();
    g.moveTo(ship.x + 24, ship.y);
    g.lineTo(ship.x - 12, ship.y - 12);
    g.lineTo(ship.x - 12, ship.y + 12);
    g.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
