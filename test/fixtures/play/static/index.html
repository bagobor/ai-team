<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>static</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 24px sans-serif; }
  h1 { margin: 0; padding: 40px; background: #234; color: #fc6; }
  form { padding: 40px; }
</style>
</head>
<body>
<!-- A page with no animation loop, as a form or a turn-based board has: it draws once and waits, and no key changes it. -->
<h1>Sign up</h1>
<form>
  <label>Name <input name="name"></label>
  <button type="button">Send</button>
</form>
</body>
</html>
